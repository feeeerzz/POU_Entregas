<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 7 - Inventario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Inventario de la tienda</h1>

    <form id="formulario-producto" novalidate>
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre">

        <label for="categoria">Categoría</label>
        <input type="text" id="categoria" name="categoria">

        <label for="cantidad">Cantidad</label>
        <input type="number" id="cantidad" name="cantidad">

        <label for="precio">Precio</label>
        <input type="number" id="precio" name="precio" step="0.01">

        <button type="submit">Agregar producto</button>
    </form>

    <p id="mensaje-error"></p>

    <label for="filtro-categoria">Filtrar por categoría</label>
    <select id="filtro-categoria">
        <option value="todas">todas</option>
    </select>

    <p>
        Productos: <span id="total-productos">0</span> |
        Unidades: <span id="total-unidades">0</span> |
        Valor total: <span id="valor-total">$0.00</span> |
        Agotados: <span id="total-agotados">0</span>
    </p>

    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Cantidad</th>
                <th>Precio</th>
                <th>Subtotal</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpo-inventario"></tbody>
    </table>

    <p id="mensaje-vacio" hidden>No hay productos para mostrar.</p>

    <script src="script.js"></script>
</body>
</html>
